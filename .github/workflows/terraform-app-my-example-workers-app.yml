# Caller workflow for app my-example-workers-app.
# All logic lives in terraform-reusable.yml; this file only defines WHEN to run and WITH WHAT.

name: "Terraform: app my-example-workers-app"

on:
  pull_request:
    paths:
      - "terraform/apps/config/my-example-workers-app.*"
      - "terraform/apps/terraform-logic/**"
      - "terraform/backend-common.s3.tfbackend"
      - ".github/workflows/terraform-app-my-example-workers-app.yml"
      - ".github/workflows/terraform-reusable.yml"
  push:
    branches: [main]
    paths:
      - "terraform/apps/config/my-example-workers-app.*"
      - "terraform/apps/terraform-logic/**"
      - "terraform/backend-common.s3.tfbackend"
      - ".github/workflows/terraform-app-my-example-workers-app.yml"
      - ".github/workflows/terraform-reusable.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      scope: app-my-example-workers-app
      working_directory: terraform/apps/terraform-logic
      var_file: ../config/my-example-workers-app.tfvars
      backend_file: ../config/my-example-workers-app.s3.tfbackend
      action: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_APP_MY_EXAMPLE_WORKERS_APP }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
