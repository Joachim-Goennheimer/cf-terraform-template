# Caller workflow for account.
# All logic lives in terraform-reusable.yml; this file only defines WHEN to run and WITH WHAT.

name: "Terraform: account"

on:
  pull_request:
    paths:
      - "terraform/account/config/account.*"
      - "terraform/account/terraform-logic/**"
      - "terraform/backend-common.s3.tfbackend"
      - ".github/workflows/terraform-account.yml"
      - ".github/workflows/terraform-reusable.yml"
  push:
    branches: [main]
    paths:
      - "terraform/account/config/account.*"
      - "terraform/account/terraform-logic/**"
      - "terraform/backend-common.s3.tfbackend"
      - ".github/workflows/terraform-account.yml"
      - ".github/workflows/terraform-reusable.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      scope: account
      working_directory: terraform/account/terraform-logic
      var_file: ../config/account.tfvars
      backend_file: ../config/account.s3.tfbackend
      action: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
