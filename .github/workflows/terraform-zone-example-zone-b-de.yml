# Caller workflow for zone example-zone-b.de.
# All logic lives in terraform-reusable.yml; this file only defines WHEN to run and WITH WHAT.

name: "Terraform: zone example-zone-b.de"

on:
  pull_request:
    paths:
      - "terraform/zones/config/example-zone-b-de.*"
      - "terraform/zones/terraform-logic/**"
      - "terraform/backend-common.s3.tfbackend"
      - ".github/workflows/terraform-zone-example-zone-b-de.yml"
      - ".github/workflows/terraform-reusable.yml"
  push:
    branches: [main]
    paths:
      - "terraform/zones/config/example-zone-b-de.*"
      - "terraform/zones/terraform-logic/**"
      - "terraform/backend-common.s3.tfbackend"
      - ".github/workflows/terraform-zone-example-zone-b-de.yml"
      - ".github/workflows/terraform-reusable.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      scope: zone-example-zone-b-de
      working_directory: terraform/zones/terraform-logic
      var_file: ../config/example-zone-b-de.tfvars
      backend_file: ../config/example-zone-b-de.s3.tfbackend
      action: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE_EXAMPLE_ZONE_B_DE }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
